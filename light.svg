<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Dongkyu Moon, AI Researcher</title>
  <desc id="desc">A clean light profile banner with a friendly orbit mascot and professional AI systems introduction.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FBFCFF"/>
      <stop offset="1" stop-color="#F5F8FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4285F4">
        <animate attributeName="stop-color" values="#4285F4;#7C4DFF;#4285F4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#34A853">
        <animate attributeName="stop-color" values="#34A853;#12B5CB;#34A853" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#F9AB00">
        <animate attributeName="stop-color" values="#F9AB00;#EA4335;#F9AB00" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="orb" cx="32%" cy="24%" r="78%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.18" stop-color="#DCEAFF"/>
      <stop offset="0.58" stop-color="#8AB4F8"/>
      <stop offset="1" stop-color="#5B6BF9"/>
    </radialGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#4285F4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4285F4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow">
      <stop offset="0" stop-color="#34A853" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#34A853" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0F172A" opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#4F6EA9" flood-opacity="0.14"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="428" rx="32"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="430" fill="url(#canvas)"/>
    <rect width="1200" height="430" fill="url(#dots)"/>
    <circle cx="1090" cy="20" r="300" fill="url(#blueGlow)">
      <animate attributeName="cx" values="1090;1010;1090" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="440" r="260" fill="url(#greenGlow)">
      <animate attributeName="cy" values="440;390;440" dur="10s" repeatCount="indefinite"/>
    </circle>

    <rect x="42" y="38" width="340" height="354" rx="28" fill="#FFFFFF" fill-opacity="0.78" stroke="#0F172A" stroke-opacity="0.08" filter="url(#shadow)"/>
    <rect x="61" y="57" width="82" height="28" rx="14" fill="#F1F5F9"/>
    <circle cx="78" cy="71" r="4" fill="#34A853">
      <animate attributeName="r" values="4;5.5;4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="91" y="75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="650" fill="#475569">ONLINE</text>

    <g transform="translate(0 0)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="5.8s" repeatCount="indefinite"/>
      <circle cx="212" cy="218" r="92" fill="#BBD4FF" opacity="0.22" filter="url(#softGlow)">
        <animate attributeName="opacity" values="0.16;0.32;0.16" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="212" cy="218" r="74" fill="url(#orb)" filter="url(#shadow)"/>
      <ellipse cx="187" cy="207" rx="7" ry="9" fill="#172554"/>
      <ellipse cx="237" cy="207" rx="7" ry="9" fill="#172554"/>
      <circle cx="184" cy="204" r="2.2" fill="#FFFFFF"/>
      <circle cx="234" cy="204" r="2.2" fill="#FFFFFF"/>
      <path d="M190 235 Q212 252 234 235" fill="none" stroke="#172554" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="212" cy="218" rx="116" ry="48" fill="none" stroke="#4285F4" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 8" transform="rotate(-18 212 218)"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 212 218" to="360 212 218" dur="13s" repeatCount="indefinite"/>
        <circle cx="104" cy="260" r="8" fill="#EA4335"/>
        <circle cx="318" cy="175" r="7" fill="#F9AB00"/>
        <circle cx="196" cy="101" r="6" fill="#34A853"/>
      </g>
    </g>

    <text x="64" y="357" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="2.2" fill="#64748B">MOON / RESEARCH ENGINEER</text>

    <g transform="translate(430 0)">
      <rect x="0" y="56" width="246" height="28" rx="14" fill="#EFF6FF" stroke="#4285F4" stroke-opacity="0.16"/>
      <text x="18" y="75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" letter-spacing="1.1" fill="#2563EB">DAEKYOCNS · R&amp;D CENTER</text>
      <text x="0" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="64" font-weight="760" letter-spacing="-2.5" fill="#0F172A">Dongkyu Moon</text>
      <text x="2" y="201" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="560" fill="#334155">Research Engineer · Vision &amp; Language AI · Full-Stack R&amp;D</text>
      <text x="2" y="243" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#64748B">Building AI services for Tugboat, Luxplorer, and NexVi.</text>
      <rect x="2" y="270" width="676" height="1" fill="#0F172A" opacity="0.08"/>

      <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600">
        <rect x="2" y="298" width="116" height="38" rx="19" fill="#F8FAFC" stroke="#0F172A" stroke-opacity="0.09"/>
        <text x="26" y="322" fill="#334155">Tugboat</text>
        <rect x="128" y="298" width="130" height="38" rx="19" fill="#F8FAFC" stroke="#0F172A" stroke-opacity="0.09"/>
        <text x="153" y="322" fill="#334155">Luxplorer</text>
        <rect x="268" y="298" width="136" height="38" rx="19" fill="#F8FAFC" stroke="#0F172A" stroke-opacity="0.09"/>
        <text x="307" y="322" fill="#334155">NexVi</text>
        <rect x="414" y="298" width="104" height="38" rx="19" fill="#F8FAFC" stroke="#0F172A" stroke-opacity="0.09"/>
        <text x="426" y="322" fill="#334155">AI Award</text>
      </g>

      <text x="2" y="377" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="0.9" fill="#64748B">research  →  data  →  model  →  service  →  impact</text>
      <rect x="542" y="365" width="8" height="15" rx="2" fill="url(#accent)">
        <animate attributeName="opacity" values="1;0.18;1" dur="1.15s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="1" y="1" width="1198" height="428" rx="32" fill="none" stroke="url(#accent)" stroke-opacity="0.28" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.18;0.42;0.18" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
